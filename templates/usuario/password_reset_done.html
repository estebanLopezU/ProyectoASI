{% extends "base.html" %}
{% block titulo %}Enlace enviado{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">

      Si el correo está registrado, recibirá un mensaje con las instrucciones para restablecer su contraseña.

  </div>
</div>
