{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1 text-center">ASI</h4>
        <p class="text-muted text-center small">Sistema de Gestión Departamental de Informática y Computación</p>
        {% if form.errors %}
          <div class="alert alert-danger small">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
        <div class="text-center mt-3">
          <a class="small" href="{% url 'usuario:password_reset' %}">¿Olvidó su contraseña?</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
