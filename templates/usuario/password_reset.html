{% extends "base.html" %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">Recuperación de contraseña (RF-03)</div>
      <div class="card-body">
        <p class="text-muted small">Ingrese su correo institucional; recibirá un enlace para restablecer la contraseña.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.email.id_for_label }}">Correo electrónico</label>
            <input type="email" name="email" id="{{ form.email.id_for_label }}" class="form-control" required>
          </div>
          <button class="btn btn-primary">Enviar enlace</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
