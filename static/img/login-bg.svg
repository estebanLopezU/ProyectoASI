<?xml version="1.0" encoding="UTF-8"?>
<!-- Fondo institucional de la pantalla de ingreso (respaldo SVG).
     Si existe static/img/login-bg.jpg se usa esa imagen en su lugar. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3b66"/>
      <stop offset="55%" stop-color="#12688f"/>
      <stop offset="100%" stop-color="#1b998b"/>
    </linearGradient>
    <pattern id="retícula" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#cielo)"/>
  <rect width="1920" height="1080" fill="url(#retícula)"/>
  <rect width="1920" height="1080" fill="url(#halo)"/>

  <!-- Círculos decorativos -->
  <circle cx="290" cy="210" r="190" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="1660" cy="880" r="260" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="1520" cy="150" r="110" fill="#1b998b" fill-opacity="0.16"/>
  <circle cx="330" cy="900" r="140" fill="#0d3b66" fill-opacity="0.30"/>

  <!-- Trama de nodos (motivo informática) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" fill="none">
    <path d="M150 720 L340 620 L540 700 L720 580 L930 660"/>
    <path d="M1180 430 L1380 350 L1580 440 L1780 360"/>
    <path d="M340 620 L320 400 L520 300"/>
    <path d="M1380 350 L1360 160"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.28">
    <circle cx="150" cy="720" r="6"/><circle cx="340" cy="620" r="7"/>
    <circle cx="540" cy="700" r="6"/><circle cx="720" cy="580" r="7"/>
    <circle cx="930" cy="660" r="6"/>
    <circle cx="1180" cy="430" r="7"/><circle cx="1380" cy="350" r="8"/>
    <circle cx="1580" cy="440" r="6"/><circle cx="1780" cy="360" r="7"/>
    <circle cx="320" cy="400" r="6"/><circle cx="520" cy="300" r="6"/>
    <circle cx="1360" cy="160" r="6"/>
  </g>

  <!-- Símbolo binario sutil -->
  <g fill="#ffffff" fill-opacity="0.07" font-family="Consolas, monospace" font-size="70">
    <text x="120" y="600">01001101</text>
    <text x="1480" y="700">10111001</text>
    <text x="900" y="220">11001</text>
    <text x="200" y="1000">101001</text>
    <text x="1600" y="1000">0110</text>
  </g>

  <!-- Banda inferior -->
  <rect x="0" y="1030" width="1920" height="50" fill="#0a2e4f" fill-opacity="0.55"/>
</svg>
